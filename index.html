<!DOCTYPE html>

<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{

 background-image: url('bg.jpg');
 background-repeat: no-repeat;
 background-position: center;
 background-size: cover;
 background-attachment: fixed;
 color:#fff;
 font-family:微软雅黑;
 text-align:center;
 padding:30px 20px;
 min-height:100vh;
}
.main{
 max-width:700px;
 margin:0 auto;
 background:rgba(0,0,0,0.55);
 border-radius:20px;
 padding:40px 20px;
 border:2px solid #d4af37;
}
h1{
 font-size:36px;
 color:#ffd700;
 margin-bottom:20px;
}
.info{
 font-size:16px;
 color:#eee;
 margin-bottom:40px;
 line-height:1.7;
}
.welfare{
 background:rgba(212,175,55,0.15);
 border-radius:15px;
 padding:25px 15px;
 margin:25px 0;
 text-align:left;
 line-height:1.8;
 font-size:15px;
 border:1px solid #d4af37;
}
.welfare h3{
 color:#ffd700;
 text-align:center;
 margin-bottom:15px;
 font-size:18px;
}
.btn{
 display:block;
 width:85%;
 height:55px;
 line-height:55px;
 background:#b8860b;
 color:#fff;
 font-size:18px;
 border-radius:12px;
 margin:14px auto;
 text-decoration:none;
 transition: background 0.3s;
 border:none;
 cursor:pointer;
}
.btn:hover{
 background:#9b7007;
}
/* 弹窗样式 */
.modal-mask{
 display:none;
 position:fixed;
 top:0;left:0;
 width:100%;height:100%;
 background:rgba(0,0,0,0.75);
 z-index:999;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.modal-box{
 background:#1a1430;
 border:2px solid #d4af37;
 border-radius:16px;
 max-width:520px;
 width:100%;
 padding:24px;
}
.modal-box h2{
 color:#ffd700;
 margin-bottom:16px;
 font-size:20px;
}
.code-textarea{
 width:100%;
 min-height:160px;
 background:#0c0820;
 color:#fff;
 border:1px solid #d4af37;
 border-radius:10px;
 padding:12px;
 font-size:15px;
 line-height:1.6;
 resize:none;
}
.modal-buttons{
 margin-top:16px;
 display:flex;
 gap:12px;
}
.modal-btn{
 flex:1;
 height:48px;
 border-radius:10px;
 border:none;
 font-size:16px;
 cursor:pointer;
}
.copy-btn{
 background:#b8860b;
 color:#fff;
}
.close-btn{
 background:#444;
 color:#fff;
}
.tip-text{
 color:#7cf07c;
 margin-top:10px;
 display:none;
}
</style>
</head>
<body>
<div class="main">
 <h1>宗师之上</h1>
 <p class="info">
  国风修仙 · 放置挂机 · 问鼎宗师<br>
  上线送海量仙玉｜金色仙宠｜专属礼包福利

 <div class="welfare">
 <h3>🎁 宗师之上永久兑换码</h3>
 <p>内测兑换码VIP10000</p>
 <p>资源到金仙</p>
 <h3>✅️注册邀请码:AA88</h3>  
 <p>注册邀请码:AA88</p>
 <p>注册邀请码:AA88</p>
 <br>

 <br>
 <p>⚠️ 领取提醒：兑换码在游戏内【头像-兑换码】兑换，全区全服通用</p>
 </div>
 <!-- 打开弹窗按钮 -->
 <button class="btn" id="openModalBtn">📋全部兑换码</button>
 <a href="https://sd.ittt.work/y9iU" class="btn">📥 下载地址</a>
 <a href="https://zsweb.hfqynn.top" class="btn">💰 充值商城</a>
 <a href="https://qm.qq.com/q/Erd1orKvlK" class="btn">📱 玩家Q群</a>
 <a href="https://1546503875-byte.github.io/zhongxin" class="btn">🎮更多游戏</a>
</div>
<!-- 弹窗DOM -->
<div class="modal-mask" id="modalMask">
 <div class="modal-box">
 <h2>全部兑换码（直接复制）</h2>
 <textarea class="code-textarea" id="codeArea" readonly>
内测兑换码VIP10000
资源到金仙
 </textarea>
 <div class="modal-buttons">
 <button class="modal-btn copy-btn" id="copyBtn">📋复制兑换码</button>
 <button class="modal-btn close-btn" id="closeBtn">关闭</button>
 </div>
 <div class="tip-text" id="copyTip">✅复制成功！去游戏粘贴兑换</div>
 </div>
</div>
<script>
const modalMask = document.getElementById('modalMask');
const openModalBtn = document.getElementById('openModalBtn');
const closeBtn = document.getElementById('closeBtn');
const copyBtn = document.getElementById('copyBtn');
const codeArea = document.getElementById('codeArea');
const copyTip = document.getElementById('copyTip');
//打开弹窗
openModalBtn.onclick = function(){
 modalMask.style.display = 'flex';
 copyTip.style.display = 'none';
}
//关闭弹窗
closeBtn.onclick = function(){
 modalMask.style.display = 'none';
}
//点击遮罩关闭
modalMask.onclick = function(e){
 if(e.target === modalMask){
 modalMask.style.display = 'none';
 }
}
//复制功能
copyBtn.onclick = async function(){
 try{
 await navigator.clipboard.writeText(codeArea.value.trim());
 copyTip.style.display = 'block';
 }catch(err){
 //降级复制方案
 codeArea.select();
 document.execCommand('copy');
 copyTip.style.display = 'block';
 }
}
</script>
</body>
</html>
